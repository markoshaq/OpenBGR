[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbgr"
version = "0.11.3"
description = "Self-hosted, zero-telemetry background removal studio powered by BiRefNet"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
openbgr = "app:main"

[tool.setuptools.packages.find]
include = ["openbgr*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # env var PYTORCH_ENABLE_MPS_FALLBACK must precede torch import
    "B008",  # FastAPI Form(...) / File(...) in argument defaults
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
