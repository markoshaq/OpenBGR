name: Build & Publish Desktop Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU-only PyTorch keeps CI fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for icon generation
        run: pip install pillow
      - name: Build OpenBGR-macOS.dmg
        run: |
          python -m py_compile app.py icon_render.py openbgr/__init__.py openbgr/config.py openbgr/models.py openbgr/pipeline.py openbgr/quick_action.py openbgr/desktop.py openbgr/api.py scripts/build_release.py scripts/make_dev_bundle.py
          bash -n start.sh "Start Mac.command"
          python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBGR-macOS-dmg
          path: dist/OpenBGR-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OpenBGR-Windows.zip (with OpenBGR.exe)
        run: |
          python -m py_compile app.py icon_render.py openbgr/__init__.py openbgr/config.py openbgr/models.py openbgr/pipeline.py openbgr/quick_action.py openbgr/desktop.py openbgr/api.py scripts/build_release.py
          python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBGR-Windows-zip
          path: dist/OpenBGR-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build OpenBGR-Linux.tar.gz
        run: |
          python -m py_compile app.py icon_render.py openbgr/__init__.py openbgr/config.py openbgr/models.py openbgr/pipeline.py openbgr/quick_action.py openbgr/desktop.py openbgr/api.py scripts/build_release.py
          bash -n start.sh
          python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBGR-Linux-tar-gz
          path: dist/OpenBGR-Linux.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OpenBGR-macOS.dmg
            release-assets/OpenBGR-Windows.zip
            release-assets/OpenBGR-Linux.tar.gz
          generate_release_notes: true
