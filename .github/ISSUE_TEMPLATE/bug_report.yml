name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Release build (.exe / .dmg / .zip / .tar.gz)
        - Running from source (start.sh / start.bat)
        - Headless / CLI only
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model tier (if applicable)
      options:
        - Lite
        - General
        - Ultra HR
        - Portrait
        - Matting
        - Dynamic
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: "Terminal output, browser console errors, or ~/Library/Logs entries for Quick Action problems"
      render: text
