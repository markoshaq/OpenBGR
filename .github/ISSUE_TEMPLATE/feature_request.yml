name: Feature Request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or friction you're hitting
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should OpenBGR do?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Check your idea against project constraints
      options:
        - label: Keeps the app 100% local (no telemetry, accounts, or cloud calls)
          required: true
